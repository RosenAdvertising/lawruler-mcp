[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lawruler-mcp"
version = "0.1.2"
description = "MCP server for LawRuler: leads, intake status, notes and custom fields."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lawruler", "mcp", "legal", "crm", "intake", "lead-management", "claude"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "defusedxml>=0.7.1,<1",
    "mcp[cli]>=2.3,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]

[project.scripts]
lawruler-mcp = "lawruler_mcp.server:main"
lawruler-mcp-setup = "lawruler_mcp.setup.oauth_flow:main"
lawruler-mcp-verify = "lawruler_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/lawruler-mcp"
Repository = "https://github.com/RosenAdvertising/lawruler-mcp"
Issues = "https://github.com/RosenAdvertising/lawruler-mcp/issues"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
